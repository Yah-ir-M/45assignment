    <script>

        }

    <script>
        let it;
        switch (new Date().getDay()) {
        case 6:
            it = "Today is Saturday";
            break;
        case 0:
            it = "Today is Sunday";
            break;
        default:
            it = "I wonder when the World Cup is?";
        }
        document.getElementById("switch").innerHTML = it;
    </script>
